name: ci-core

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # bash on every runner: PowerShell mangles "-Dprop=" with an empty value into a
    # bogus lifecycle phase (LifecyclePhaseNotFoundException on windows-latest).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check repository content and documentation
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/check_repository.py

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and test (SIMD)
        run: mvn -B verify

      - name: Core tests without Vector API (scalar fallback)
        run: mvn -B -pl arbercharts-core test -Darbercharts.test.jvmargs=

name: ci-core

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and test (SIMD)
        run: mvn -B verify

      - name: Core tests without Vector API (scalar fallback)
        run: mvn -B -pl arbercharts-core test -Darbercharts.test.jvmargs=

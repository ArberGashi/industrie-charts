TextField.margin = 5,7,5,7
TextField.arc = 5
ComboBox.background = @surface
ComboBox.foreground = @text
ComboBox.buttonBackground = @surface
ComboBox.selectionBackground = @selection
ComboBox.selectionForeground = @text

Tree.background = @sidebar

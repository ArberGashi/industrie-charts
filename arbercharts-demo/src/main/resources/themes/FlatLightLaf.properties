# Industrie Charts workbench: neutral chrome and a white chart workspace.
@window = #EDF0F4
@content = #FFFFFF
@sidebar = #F4F6F8
@surface = #FFFFFF
@text = #283442
@muted = #647185
@disabled = #8995A5
@border = #D6DCE4
@accent = #2866AE
@selection = #DDE9F8
@hover = #E3E9F0
@scrollbar = #B9C3CF

# Compact workbench surfaces and controls. Tokens are shared by both appearances.
@background = @window
@foreground = @text
@disabledForeground = @disabled
@selectionBackground = @selection
@selectionForeground = @text
@accentColor = @accent
@focusColor = @accent

Demo.windowBackground = @window
Demo.contentBackground = @content
Demo.surfaceBackground = @surface
Panel.background = @window
Panel.foreground = @text
Viewport.background = @sidebar
Label.foreground = @text
Label.disabledForeground = @disabled
Component.grayForeground = @muted
Component.borderColor = @border
Component.disabledBorderColor = @border
Component.focusColor = @accent
Component.linkColor = @accent
Component.focusWidth = 1
Component.arc = 5
Separator.foreground = @border

TitlePane.background = @window
TitlePane.foreground = @muted
TitlePane.inactiveBackground = @window
TitlePane.inactiveForeground = @disabled
TitlePane.borderColor = @border
MenuBar.background = @window
MenuBar.foreground = @text
MenuBar.borderColor = @border
ToolBar.background = @window
ToolBar.borderColor = @border
PopupMenu.background = @surface
PopupMenu.borderColor = @border
Menu.background = @surface
Menu.foreground = @text
Menu.selectionBackground = @selection
MenuItem.background = @surface
MenuItem.foreground = @text
MenuItem.selectionBackground = @selection
MenuItem.selectionForeground = @text
MenuItem.acceleratorForeground = @muted

Button.background = @surface
Button.foreground = @text
